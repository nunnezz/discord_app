name: cord_app
description: Cord — clone do Discord com Supabase em tempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

  # Backend / banco de dados em tempo real + autenticação
  supabase_flutter: ^2.6.0

  # Carrega .env em tempo de execução para URL/chaves do projeto
  flutter_dotenv: ^5.1.1

  # Selecionar/tirar foto para o avatar do perfil
  image_picker: ^1.1.2

  # Formatação de data/hora (usado no chat e nas notificações)
  intl: ^0.19.0

  # Chamada de voz/vídeo com múltiplos participantes (SFU gerenciado).
  # Você precisa criar uma conta gratuita em https://www.agora.io e
  # gerar um App ID no painel deles.
  agora_rtc_engine: ^6.3.2

  cupertino_icons: ^1.0.8
  video_player: ^2.14.1

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - .env
